version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: asm_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: asm_web
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d

  backend:
    build: ./backend
    container_name: asm_backend
    restart: always
    ports:
      - "8000:80"
    depends_on:
      - mysql
    env_file:
      - ./backend/.env.docker
    volumes:
      - ./backend:/var/www/html

  frontend:
    build: ./frontend
    container_name: asm_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - ./frontend/.env.docker

volumes:
  mysql_data: